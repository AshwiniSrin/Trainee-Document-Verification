<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Verification Agent Test</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      button { padding: 0.6rem 1rem; cursor: pointer; }
      pre { background: #f5f5f5; padding: 1rem; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Verification Agent Test</h1>
    <button onclick="sendRequest()">Send test request</button>
    <h2>Response</h2>
    <pre id="output">Waiting...</pre>

    <script>
      async function sendRequest() {
        const output = document.getElementById('output');
        output.textContent = 'Sending...';

        try {
          const response = await fetch('/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              name: 'Jane Doe',
              id: '123456',
              documents: ['id_card'],
              use_fake_data: true
            })
          });

          const data = await response.json();
          output.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          output.textContent = 'Error: ' + error.message;
        }
      }
    </script>
  </body>
</html>
