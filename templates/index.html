<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Verification Agent Test</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; }
      button { padding: 0.6rem 1rem; cursor: pointer; }
      pre { background: #f5f5f5; padding: 1rem; white-space: pre-wrap; }
      .row { margin-bottom: 1rem; }
    </style>
  </head>
  <body>
    <h1>Verification Agent Test</h1>
    <form id="upload-form" onsubmit="event.preventDefault(); sendRequest();">
      <div class="row">
        <label for="file">Upload document</label>
        <input id="file" name="file" type="file" />
      </div>
      <div class="row">
        <button type="submit">Upload and process</button>
      </div>
    </form>
    <h2>Response</h2>
    <pre id="output">Waiting...</pre>

    <script>
      async function sendRequest() {
        const output = document.getElementById('output');
        const fileInput = document.getElementById('file');
        output.textContent = 'Sending...';

        try {
          const formData = new FormData();
          if (fileInput.files.length > 0) {
            formData.append('file', fileInput.files[0]);
          }

          const response = await fetch('/upload', {
            method: 'POST',
            body: formData
          });

          const data = await response.json();
          output.textContent = JSON.stringify(data, null, 2);
        } catch (error) {
          output.textContent = 'Error: ' + error.message;
        }
      }
    </script>
  </body>
</html>
